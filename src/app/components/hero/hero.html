<section class="hero-container">
  <video #heroVideo class="hero-bg-video" autoplay loop muted playsinline preload="auto" poster="assets/hero-poster.jpg" src="assets/hero-bg.mp4"></video>

  <!-- This cover scrolls up with the page, revealing the clean video underneath -->
  <div class="hero-blur-lid"></div>

  <!-- Content sits inside a 100vh wrapper so it aligns with the blur lid -->
  <div class="hero-content-wrapper">
    <div class="hero-content">
      <h1 class="hero-title text-gradient">La música en su<br>máxima dimensión.</h1>
      <p class="hero-subtitle">
        Conciertos en Realidad Virtual y Aumentada.<br>Vive la experiencia como si estuvieras en primera fila.
      </p>
      
      <div class="hero-actions">
        <button class="btn-primary btn-large" (click)="scrollToSection('beta')">Unirse a la lista de espera</button>
        <button class="btn-secondary btn-large" (click)="scrollToSection('experiencia')">
          <span class="icon">▶</span> Ver Demo
        </button>
      </div>
    </div>
  </div>
</section>
