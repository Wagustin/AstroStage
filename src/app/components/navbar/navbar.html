<nav class="navbar" [class.menu-open]="isMenuOpen">
  <div class="navbar-header">
    <div class="logo-container">
      <a href="#" class="reactive-logo" (click)="scrollToTop($event)">AstroStage</a>
    </div>

    <!-- Hamburger menu icon -->
    <label class="hamburger">
      <input type="checkbox" [checked]="isMenuOpen" (change)="toggleMenu()">
      <svg viewBox="0 0 32 32">
        <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
        <path class="line" d="M7 16 27 16"></path>
      </svg>
    </label>
  </div>
  
  <div class="nav-content" [class.open]="isMenuOpen">
    <ul class="nav-links">
      <li><a href="#" (click)="scrollToSection('experiencia', $event)">Experiencia</a></li>
      <li><a href="#" (click)="scrollToSection('tecnologia', $event)">Tecnología</a></li>
      <li><a href="#" (click)="scrollToSection('alquiler', $event)">Alquiler</a></li>
      <li><a href="#" (click)="scrollToSection('nosotros', $event)">Nosotros</a></li>
    </ul>
    
    <div class="nav-actions">
      <label class="container" aria-label="Toggle Audio">
        <!-- If it's muted, the checkbox is unchecked, so voice is hidden and mute is shown -->
        <input type="checkbox" [checked]="!(audioService.isMuted | async)" (change)="audioService.toggleMute()">
        <svg class="mute" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <svg class="voice" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </label>

      <label class="switch" aria-label="Toggle Theme">
        <input type="checkbox" class="input" [checked]="!isLightTheme" (change)="toggleTheme()">
        <span class="slider">
          <span class="sun">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="5" fill="#fff"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="moon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 15A8.5 8.5 0 1 1 9 4a8.5 8.5 0 0 0 11 11z"/>
            </svg>
          </span>
        </span>
      </label>
      <button class="btn-secondary" (click)="scrollToSection('beta', $event)">Unirse a la Beta</button>
    </div>
  </div>
</nav>
