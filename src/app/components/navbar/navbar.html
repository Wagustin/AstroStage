<nav class="navbar" [class.menu-open]="isMenuOpen">
  <div class="navbar-header">
    <div class="logo-container">
      <a routerLink="/" class="reactive-logo" (click)="closeMenu()">AstroStage</a>
    </div>

    <!-- Hamburger menu icon -->
    <label class="hamburger">
      <input type="checkbox" [checked]="isMenuOpen" (change)="toggleMenu()">
      <svg viewBox="0 0 32 32">
        <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
        <path class="line" d="M7 16 27 16"></path>
      </svg>
    </label>
  </div>
  
  <div class="nav-content" [class.open]="isMenuOpen">
    <ul class="nav-links">
      <li><a href="#" (click)="scrollToSection('experiencia', $event)">Experiencia</a></li>
      <li><a href="#" (click)="scrollToSection('tecnologia', $event)">Tecnología</a></li>
      <li><a href="#" (click)="scrollToSection('alquiler', $event)">Alquiler</a></li>
      <li><a href="#" (click)="scrollToSection('nosotros', $event)">Nosotros</a></li>
    </ul>
    
    <div class="nav-actions">
      <label class="switch" aria-label="Toggle Theme">
        <input type="checkbox" class="input" [checked]="!isLightTheme" (change)="toggleTheme()">
        <span class="slider">
          <span class="sun">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="5" fill="#fff"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="moon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
              <path d="M21.75 15.5a9.24 9.24 0 01-12.87-8.6A9.06 9.06 0 019.5 3a9.24 9.24 0 000 18c2.94 0 5.56-1.38 7.25-3.53a9.28 9.28 0 005-1.97z" fill="currentColor"/>
            </svg>
          </span>
        </span>
      </label>
      <button class="btn-primary" (click)="scrollToSection('beta', $event)">Unirse a la Beta</button>
    </div>
  </div>
</nav>
